<!doctype html> 
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mesa de Examen en vivo</title>
<meta name="description" content="Subí tus apuntes y practicá conversando en voz alta con una IA que te toma examen, escucha tus exposiciones y explica lo que no entendés.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f5f2ea; --surface:#fffdf8; --surface2:#eee9db; --fg:#1d2321; --muted:#5b6560; --line:#d9d2c0;
  --accent:#1f5d49; --accent-fg:#ffffff; --accent-soft:#dcebe4;
  --ok:#1d7447; --ok-soft:#e0f0e6; --warn:#92600f; --warn-soft:#f6e8cc; --bad:#a23a2e; --bad-soft:#f6ddd9;
  --serif:'Fraunces',Georgia,'Times New Roman',serif; --sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121715; --surface:#1a211e; --surface2:#222b27; --fg:#e8ece9; --muted:#9aa7a0; --line:#2f3b36;
    --accent:#6cc4a0; --accent-fg:#0d1f18; --accent-soft:#1d3329;
    --ok:#6fcf97; --ok-soft:#1b3326; --warn:#e3b45c; --warn-soft:#3a2f17; --bad:#ef8a7d; --bad-soft:#3a1f1b;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.9rem} h2{font-size:1.3rem} h3{font-size:1.02rem}
p{margin:0}
[hidden]{display:none!important}
.eyebrow{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.88rem}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px}
.top>div{min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 .97rem var(--sans);padding:10px 14px;cursor:pointer;white-space:nowrap;min-height:44px}
.tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.using{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 0 4px;font-size:.88rem;color:var(--muted)}
.chip{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.panel{display:flex;flex-direction:column;gap:16px;padding-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .grow{flex:1}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .95rem var(--sans);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.big{min-height:52px;padding:0 24px;font-size:1.05rem}
.btn.small{min-height:36px;padding:0 12px;font-size:.85rem}
.btn.ghost{background:none}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
input[type=text],input[type=password],input[type=search],textarea,select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;line-height:1.5}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:7px 14px;font:600 .88rem var(--sans);cursor:pointer;min-height:38px}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tog{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:2px}
.note{background:var(--warn-soft);border:1px solid var(--warn);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:.92rem}
.note.bad{background:var(--bad-soft);border-color:var(--bad)}
.note.ok{background:var(--ok-soft);border-color:var(--ok)}
.check{display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.check .it{display:flex;gap:10px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.ok{background:var(--ok)} .dot.no{background:var(--bad)}
.mat{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.mat:first-child{border-top:0;padding-top:0}
.mat input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);margin-top:2px;flex:none}
.mat .info{flex:1;min-width:0}
.mat .t{font-weight:600;overflow-wrap:anywhere}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.drop{border-style:dashed}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.think{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);padding:6px 0}
.dots{display:inline-flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.badge{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.badge.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.badge.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.badge.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.verdict{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.nota{font-family:var(--serif);font-size:2.4rem;font-weight:600;line-height:1}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card ul.l{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.err{border-left:3px solid var(--bad);padding:6px 12px;background:var(--bad-soft);border-radius:0 8px 8px 0;font-size:.94rem}
details{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
details summary{cursor:pointer;font-weight:600;min-height:24px}
details[open]>summary{margin-bottom:8px}
.stat{display:flex;gap:18px;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}
.stat b{color:var(--fg)}
.hist{display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.hist .h{display:flex;justify-content:space-between;gap:10px;align-items:center}
.empty{text-align:center;padding:10px 0;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* charla en vivo */
.live{display:flex;flex-direction:column;gap:16px;align-items:stretch}
.livebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-family:var(--serif);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.timer.warn{color:var(--warn)} .timer.bad{color:var(--bad)}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.orb{width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--accent),#0f3b2d);box-shadow:0 0 0 0 var(--accent-soft)}
@media (prefers-color-scheme: dark){.orb{background:radial-gradient(circle at 35% 30%,#8fe0bf,var(--accent))}}
.orb[data-s=listening]{animation:ring 1.8s infinite}
.orb[data-s=thinking]{animation:think 1.1s infinite ease-in-out}
.orb[data-s=speaking]{animation:talk .6s infinite alternate ease-in-out}
.orb[data-s=paused]{filter:grayscale(1);opacity:.45}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--accent-soft)}70%{box-shadow:0 0 0 26px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes think{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1);opacity:1}}
@keyframes talk{from{transform:scale(.97)}to{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.orb,.orb[data-s]{animation:none}.dots i{animation:none;opacity:.7}}
.status{font-weight:600;color:var(--muted);min-height:1.5em;text-align:center}
.cap{font-family:var(--serif);font-size:1.35rem;line-height:1.45;text-align:center;overflow-wrap:anywhere;min-height:3.2em;max-height:40vh;overflow:auto}
.you{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;min-height:3.4em;color:var(--muted);font-style:italic;overflow-wrap:anywhere;max-height:34vh;overflow:auto}
.you.big{font-style:normal;color:var(--fg);min-height:9em;max-height:46vh}
.ctrls{justify-content:center}
.log{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;font-size:.94rem}
.log .m{padding:8px 12px;border-radius:10px;overflow-wrap:anywhere;white-space:pre-wrap}
.log .m.u{background:var(--accent-soft);align-self:flex-end;max-width:92%}
.log .m.a{background:var(--surface2);align-self:flex-start;max-width:92%}
@media (max-width:520px){h1{font-size:1.6rem}.tab{padding:10px 10px;font-size:.92rem}.card{padding:14px}.cap{font-size:1.2rem}.orb{width:104px;height:104px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><p class="eyebrow">Estudio con tus apuntes</p><h1>Mesa de Examen en vivo</h1></div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button class="tab" role="tab" data-tab="charla" aria-selected="true">Charla</button>
    <button class="tab" role="tab" data-tab="apuntes" aria-selected="false">Apuntes</button>
    <button class="tab" role="tab" data-tab="ajustes" aria-selected="false">Ajustes</button>
  </nav>
  <div class="using" id="using"></div>
  <main>
    <section class="panel" id="p-charla"></section>
    <section class="panel" id="p-apuntes" hidden></section>
    <section class="panel" id="p-ajustes" hidden></section>
  </main>
</div>

<script>
(()=>{
'use strict';
/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=n=>Number(n).toLocaleString('es-AR');
const mmss=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const nota1=n=>(Math.round(n*10)/10).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:1});
const arr=a=>Array.isArray(a)?a.filter(x=>x!=null&&x!==''):[];
const words=t=>(String(t).trim().match(/\S+/g)||[]).length;
const join=(a,b)=>[a,b].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
const LSg=k=>{try{const x=localStorage.getItem('mesa:'+k);return x==null?null:JSON.parse(x)}catch(e){return null}};
const LSs=(k,v)=>{try{localStorage.setItem('mesa:'+k,JSON.stringify(v));return true}catch(e){return false}};
const ICON={
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  micoff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M9 9v2a3 3 0 0 0 5 2M15 9V6a3 3 0 0 0-5.7-1.3M5 11a7 7 0 0 0 11 5.7M19 11a7 7 0 0 1-.6 2.8M12 18v3"/></svg>',
  spk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'
};

/* ================= configuración ================= */
const CFG=Object.assign({key:'',model:'claude-haiku-5-5',repModel:'claude-sonnet-5-5',voice:'',rate:1.05,silence:1.6,lang:'es-AR',barge:false,tts:true},LSg('cfg')||{});
const saveCfg=()=>LSs('cfg',CFG);
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
const TTS='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;

/* ================= almacenamiento local (IndexedDB) ================= */
let IDBp=null;
function idb(){
  if(IDBp)return IDBp;
  IDBp=new Promise((res,rej)=>{
    if(!window.indexedDB){rej(new Error('sin indexedDB'));return}
    const rq=indexedDB.open('mesa-en-vivo',1);
    rq.onupgradeneeded=()=>{const d=rq.result;d.createObjectStore('mats',{keyPath:'id'});d.createObjectStore('hist',{keyPath:'id'})};
    rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);
  });
  return IDBp;
}
async function dbAll(st){const d=await idb();return new Promise((res,rej)=>{const r=d.transaction(st).objectStore(st).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
async function dbPut(st,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(st,'readwrite');t.objectStore(st).put(v);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function dbDel(st,id){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(st,'readwrite');t.objectStore(st).delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}

/* ================= estado ================= */
const S={tab:'charla',mats:[],hist:[],sel:new Set(LSg('sel')||[]),upMsg:'',pasteOpen:false,delAsk:null,setup:{mode:'exam',level:'final',min:5,tema:''},keyMsg:'',keyMsgCls:''};

/* ================= lectura de archivos ================= */
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const MAMMOTH='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
const loadScript=url=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=url;s.onload=res;s.onerror=()=>rej(new Error('No pude cargar el lector de archivos. Revisá tu conexión e intentá de nuevo.'));document.head.appendChild(s)});
async function readPdf(file,prog){
  if(!window.pdfjsLib)await loadScript(PDFJS);
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;
  const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const out=[];let total=0;
  for(let p=1;p<=doc.numPages;p++){
    prog&&prog(p,doc.numPages);
    const tc=await (await doc.getPage(p)).getTextContent();
    let t='';tc.items.forEach(it=>{t+=it.str+(it.hasEOL?'\n':' ')});
    t=t.replace(/-\n(?=[a-záéíóúñ])/g,'').replace(/[ \t]+/g,' ').replace(/ ?\n ?/g,'\n').trim();
    total+=t.length;out.push('[p. '+p+']\n\n'+t);
  }
  const warn=total<doc.numPages*60?'Este PDF casi no tiene texto seleccionable (parece escaneado o son fotos). No puedo leer imágenes: pasalo por un lector de texto (OCR) o pegá el contenido.':'';
  return{text:out.join('\n\n'),warn};
}
async function readDocx(file){
  if(!window.mammoth)await loadScript(MAMMOTH);
  const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
  return{text:r.value,warn:''};
}
async function parseFile(file,prog){
  const n=file.name.toLowerCase();
  if(n.endsWith('.pdf'))return readPdf(file,prog);
  if(n.endsWith('.docx'))return readDocx(file);
  if(n.endsWith('.doc'))throw new Error('Los .doc viejos no se pueden leer. Guardalo como .docx o PDF.');
  if(/\.(txt|md|markdown)$/.test(n))return{text:await file.text(),warn:''};
  throw new Error('Formato no admitido. Usá PDF, Word (.docx) o texto.');
}
const normText=t=>String(t).replace(/\r/g,'').replace(/\u00a0/g,' ').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
const titleFrom=n=>n.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').trim()||'Apunte';

/* ================= fragmentos y búsqueda ================= */
const STOP=new Set('de la el los las un una unos unas y o u e en a al del que se su sus por con para es son como mas pero si no lo le les este esta estos estas ese esa eso entre sobre sin muy puede pueden ser cual cuales hay fue han ha tiene tienen cada todo todos toda todas'.split(' '));
const tok=s=>fold(s).split(/[^a-z0-9]+/).filter(t=>t.length>2&&!STOP.has(t));
let CH=[],DF=new Map();
function chunkMat(m){
  const out=[];let page=null,buf='',bp=null;
  const flush=()=>{if(buf.trim().length>40)out.push({mid:m.id,title:m.title,page:bp,text:buf.trim()});buf='';bp=null};
  const pieces=[];
  m.text.split(/\n{2,}/).forEach(p=>{p=p.trim();if(!p)return;
    const mk=p.match(/^\[p\. (\d+)\]$/);if(mk){pieces.push({mark:+mk[1]});return}
    if(p.length<=1400){pieces.push({t:p});return}
    let cur='';p.split(/(?<=[.!?:;])\s+/).forEach(s=>{if((cur+' '+s).length>1400&&cur){pieces.push({t:cur});cur=s}else cur=cur?cur+' '+s:s});
    if(cur)pieces.push({t:cur});
  });
  pieces.forEach(x=>{
    if(x.mark!=null){page=x.mark;return}
    if(!buf)bp=page;buf+=(buf?'\n\n':'')+x.t;
    if(buf.length>=900)flush();
  });
  flush();return out;
}
function rebuildIndex(){
  CH=[];S.mats.forEach(m=>chunkMat(m).forEach(c=>CH.push(c)));
  DF=new Map();
  CH.forEach(c=>{c.words=new Map();tok(c.text).forEach(w=>c.words.set(w,(c.words.get(w)||0)+1));c.words.forEach((_,w)=>DF.set(w,(DF.get(w)||0)+1))});
}
function scoreChunk(c,qt){
  let s=0;
  for(const t of qt){
    let tf=c.words.get(t)||0;
    if(!tf&&t.length>=6){const st=t.slice(0,5);c.words.forEach((n,w)=>{if(w.length>=6&&w.startsWith(st))tf+=n*.5})}
    if(tf)s+=Math.log(1+CH.length/(1+(DF.get(t)||1)))*(1+Math.log(tf));
  }
  return s;
}
const srcLabel=c=>c.title+(c.page?' · p. '+c.page:'');
const selMats=()=>S.mats.filter(m=>S.sel.has(m.id));
const poolOf=mids=>{const set=new Set(mids);return CH.map((c,i)=>({c,i})).filter(x=>set.has(x.c.mid))};
const totalChars=mids=>poolOf(mids).reduce((n,x)=>n+x.c.text.length,0);
const blockOf=list=>list.map(x=>'[Fuente: '+srcLabel(x.c)+']\n'+x.c.text).join('\n\n');
function allNotes(mids){return blockOf(poolOf(mids))}
function retrieve(query,mids,budget){
  const pool=poolOf(mids);const qt=[...new Set(tok(query))];if(!qt.length)return'';
  const sc=pool.map(x=>({x,s:scoreChunk(x.c,qt)})).filter(o=>o.s>0).sort((a,b)=>b.s-a.s);
  let n=0;const chosen=[];for(const o of sc){if(n+o.x.c.text.length>budget)continue;chosen.push(o.x);n+=o.x.c.text.length}
  chosen.sort((a,b)=>a.i-b.i);return blockOf(chosen);
}
function sampleNotes(mids,budget){
  const pool=poolOf(mids);if(!pool.length)return'';
  const avg=pool.reduce((n,x)=>n+x.c.text.length,0)/pool.length,k=Math.max(1,Math.floor(budget/avg));
  const out=[];for(let j=0;j<k;j++)out.push(pool[Math.floor(Math.random()*pool.length)]);
  const seen=new Set();return blockOf(out.filter(x=>!seen.has(x.i)&&seen.add(x.i)));
}
const BIG=90000;

/* ================= cliente de la API de Anthropic ================= */
const API='https://api.anthropic.com/v1/messages';
class ApiErr extends Error{constructor(kind,msg){super(msg);this.kind=kind}}
async function apiFetch(body,signal){
  if(!CFG.key)throw new ApiErr('nokey','Falta la clave de la API. Pegala en Ajustes.');
  let r;
  try{
    r=await fetch(API,{method:'POST',signal,headers:{'content-type':'application/json','x-api-key':CFG.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
  }catch(e){if(e.name==='AbortError')throw e;throw new ApiErr('net','No pude conectarme con Anthropic. Revisá tu conexión a internet.')}
  if(!r.ok){
    let m='';try{const j=await r.json();m=j&&j.error&&j.error.message||''}catch(e){}
    if(r.status===401)throw new ApiErr('auth','La clave de la API no es válida. Revisala en Ajustes.');
    if(r.status===403)throw new ApiErr('auth','Esa clave no tiene permiso para usar este modelo.');
    if(r.status===404)throw new ApiErr('model','El modelo «'+body.model+'» no está disponible. Cambialo en Ajustes.');
    if(r.status===429)throw new ApiErr('rate','Se alcanzó el límite de uso de la API. Esperá un momento y reintentá.');
    if(r.status===400&&/credit|balance/i.test(m))throw new ApiErr('credit','La cuenta de la API no tiene saldo. Cargá crédito en la consola de Anthropic.');
    if(r.status>=500)throw new ApiErr('busy','El servicio de Anthropic está ocupado. Reintentá en unos segundos.');
    throw new ApiErr('other','La API respondió con un error ('+r.status+'). '+m.slice(0,160));
  }
  return r;
}
async function streamChat({model,system,messages,max_tokens,signal,onDelta}){
  const r=await apiFetch({model,max_tokens,system,messages,stream:true},signal);
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){
    const {value,done}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;while((i=buf.indexOf('\n\n'))>=0){
      const ev=buf.slice(0,i);buf=buf.slice(i+2);
      const line=ev.split('\n').find(l=>l.startsWith('data:'));if(!line)continue;
      let j;try{j=JSON.parse(line.slice(5).trim())}catch(e){continue}
      if(j.type==='content_block_delta'&&j.delta&&j.delta.type==='text_delta')onDelta(j.delta.text);
      else if(j.type==='error')throw new ApiErr('busy',(j.error&&j.error.message)||'Error del servicio.');
    }
  }
}
async function completeOnce({model,system,messages,max_tokens,signal}){
  const r=await apiFetch({model,max_tokens,system,messages},signal);
  const j=await r.json();return(j.content||[]).map(b=>b.text||'').join('');
}
function parseJSON(t){
  try{return JSON.parse(t)}catch(e){}
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  throw new ApiErr('json','La devolución vino mal armada.');
}

let VOICES=[];
function loadVoices(){if(!TTS)return;VOICES=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));if(S.tab==='ajustes')renderAjustes()}
if(TTS){loadVoices();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',loadVoices)}
function pickVoice(){
  if(!VOICES.length)return null;
  if(CFG.voice){const v=VOICES.find(x=>x.voiceURI===CFG.voice);if(v)return v}
  const score=v=>(/es[-_]AR/i.test(v.lang)?30:/es[-_](419|MX|US|UY|CL|CO)/i.test(v.lang)?20:10)+(/natural|neural|online/i.test(v.name)?15:0);
  return[...VOICES].sort((a,b)=>score(b)-score(a))[0];
}
const TQ={n:0,gen:0};
function ttsEnqueue(text){
  if(!TTS||!CFG.tts)return;
  const clean=String(text).replace(/\[[^\]]*\]/g,' ').replace(/[*_`#>|~]/g,' ').replace(/\s+/g,' ').trim();
  if(!/[\wáéíóúñ]/i.test(clean))return;
  try{
    const u=new SpeechSynthesisUtterance(clean);const v=pickVoice();
    u.lang=(v&&v.lang)||'es-AR';if(v)u.voice=v;u.rate=CFG.rate;
    const g=TQ.gen;TQ.n++;
    const done=()=>{if(g!==TQ.gen)return;TQ.n=Math.max(0,TQ.n-1);maybeResume()};
    u.onend=done;u.onerror=done;
    speechSynthesis.speak(u);
  }catch(e){TQ.n=Math.max(0,TQ.n-1)}
}
function ttsCancel(){TQ.gen++;TQ.n=0;if(TTS)try{speechSynthesis.cancel()}catch(e){}}
function unlockTTS(){if(!TTS)return;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
function speakNow(text){ttsCancel();ttsEnqueue(text)}

const STYLE=`Estás en una conversación HABLADA en vivo: lo que escribas se lee en voz alta. Reglas de estilo: frases cortas y naturales, como hablaría una persona; sin Markdown, sin listas, sin emojis ni símbolos raros. No leas citas ni números de página: si hace falta nombrar la fuente, decí «en tu apunte de…». Máximo tres o cuatro oraciones por turno, salvo que te pidan explicar algo largo. Un solo tema o pregunta por turno. Hablás en español rioplatense (voseo), con calidez y sin sermonear.`;

}

/* --- reconocimiento de voz --- */
function listenStop(){
  const r=L.rec;L.rec=null;L.recOn=false;
  if(r){try{r.onresult=r.onerror=r.onend=null;r.abort()}catch(e){}}
}
function listenStart(){
  if(!SRC||!L.on||L.recOn||!wantMic())return;
  const rec=new SRC();rec.lang=CFG.lang;rec.continuous=true;rec.interimResults=true;
  L.rec=rec;L.recOn=true;L.lastStart=Date.now();L.nres=0;L.skipN=0;
  rec.onresult=e=>{
    if(rec!==L.rec)return;
    L.nres=e.results.length;
    L.sess=Array.from(e.results).slice(L.skipN).map(r=>r[0].transcript).join(' ').replace(/\s+/g,' ').trim();
    onHear();
  };
  rec.onerror=e=>{
    if(rec!==L.rec)return;
    const f=(m)=>{L.recOn=false;L.rec=null;L.err=m;setState('paused')};
    if(e.error==='not-allowed'||e.error==='service-not-allowed')f('No tengo permiso para usar el micrófono. Tocá el candado junto a la dirección de la página, permití el micrófono y recargá. Mientras tanto podés escribir abajo.');
    else if(e.error==='audio-capture')f('No encontré un micrófono. Conectá uno o escribí abajo.');
    else if(e.error==='network')f('El dictado necesita conexión a internet (usa el servicio del navegador).');
  };
  rec.onend=()=>{
    if(rec!==L.rec)return;
    L.recOn=false;L.base=join(L.base,L.sess);L.sess='';L.rec=null;
    if(L.on&&wantMic()){
      if(Date.now()-L.lastStart>700)listenStart();
      else{L.err='El dictado se cortó varias veces seguidas. Tocá «Reanudar micrófono» o escribí abajo.';setState('paused')}
    }
  };
  try{rec.start()}catch(e){L.recOn=false;L.rec=null}
}
const FIN_RE=/(termin[eé] (mi|la) exposici[oó]n|ya termin[eé]|eso es todo|eso es todo por mi parte)[\s.!]*$/i;
function onHear(){
  showYou();
  if(L.phase==='expo'){
    if(FIN_RE.test(heard())){expoFinish(true)}
    return;
  }
  if(CFG.barge&&(L.state==='thinking'||L.state==='speaking')){
    if(words(heard())>=2)interrupt();else return;
  }
  if(L.state!=='listening')return;

  L.ct=setTimeout(()=>{if(L.on&&L.state==='listening'&&heard().length>1)commitTurn(heard())},Math.round(CFG.silence*1000));
}
function interrupt(){
  L.turn++;if(L.ctl)L.ctl.abort();ttsCancel();
  if(!L.aiDone){if(L.aiText.trim())addMsg('assistant',L.aiText.trim()+' [interrumpida]')}
  else{const lm=L.msgs[L.msgs.length-1];if(lm&&lm.role==='assistant'&&!/\[interrumpida\]$/.test(lm.content))lm.content+=' [interrumpida]'}

function systemBlocks(){

  if(!L.big)sys.push({type:'text',text:'<apuntes>\n'+L.notesSys+'\n</apuntes>',cache_control:{type:'ephemeral'}});

function buildMessages(){
  const msgs=L.msgs.map(m=>({role:m.role,content:m.content}));
  if(L.big){
    const last=msgs[msgs.length-1];
    const lastAi=[...L.msgs].reverse().find(m=>m.role==='assistant');
    const q=last.content.slice(0,3000)+' '+(lastAi?lastAi.content.slice(0,600):'');
    const rel=retrieve(q,L.mids,16000),extra=sampleNotes(L.mids,5000);

  }
  return msgs;
}
let fbuf='',ffirst=true;
function feed(d){fbuf+=d;drain(false)}
function drain(final){
  for(;;){
    const re=/[.!?…]+["»”)]*(\s+)|\n+/g;let m,cut=-1;
    while((m=re.exec(fbuf))){const end=m.index+m[0].length;if(end>=(ffirst?18:45)){cut=end;break}}
    if(cut<0)break;ttsEnqueue(fbuf.slice(0,cut));fbuf=fbuf.slice(cut);ffirst=false;
  }
  if(final&&fbuf.trim()){ttsEnqueue(fbuf);fbuf=''}
}
async function callAI(){

      onDelta:d=>{if(id!==L.turn)return;if(L.state==='thinking')setState('speaking');L.aiText+=d;showCaption(L.aiText);feed(d)}});
    if(id!==L.turn)return;
    L.aiDone=true;drain(true);addMsg('assistant',L.aiText.trim()||'(sin respuesta)');
    if(!L.aiText.trim())L.aiText='';

  }catch(e){
    if(id!==L.turn||(e&&e.name==='AbortError'))return;
    L.aiDone=true;ttsCancel();

  const trCut=tr.length>45000?'…'+tr.slice(-45000):tr;
  const sys=[{type:'text',text:`${NOTES_RULES}\nSos un tutor universitario argentino que hace devoluciones claras y justas, en español rioplatense.`}];
  if(!L.big)sys.push({type:'text',text:'<apuntes>\n'+L.notesSys+'\n</apuntes>',cache_control:{type:'ephemeral'}});
  const rel=L.big?'<apuntes_relevantes>\n'+retrieve(trCut.slice(-6000),L.mids,22000)+'\n</apuntes_relevantes>\n\n':'';
  const prompt=`${rel}Esta es la transcripción de una sesión de práctica oral (modo: ${MODES[L.mode].name}). Los dichos de la estudiante vienen de dictado: ignorá puntuación y errores de transcripción.\n\n<transcripcion>\n${trCut}\n</transcripcion>\n\nHacé la devolución final comparando con los apuntes. Devolvé SOLO un objeto JSON:\n{"nota":<número de 0 a 10, o null si no hubo nada que evaluar>,"resumen":"2 o 3 frases","fortalezas":["..."],"para_mejorar":[{"tema":"...","detalle":"qué dicen los apuntes y qué faltó"}],"errores":[{"dijo":"...","correcto":"..."}],"temas_para_repasar":["..."],"consejos":["3 a 5 consejos concretos"]}\nIncluí en "errores" solo afirmaciones suyas que contradigan los apuntes. Listas vacías si no hay nada para decir.`;
  try{
    const out=await completeOnce({model:CFG.repModel||CFG.model,system:sys,messages:[{role:'user',content:prompt}],max_tokens:2500});
    const rep=parseJSON(out);
    const h={id:uid(),ts:Date.now(),mode:L.mode,tema:S.setup.tema,dur:Math.round(L.acc||(Date.now()-L.started)/1000),rep,expo:L.expoMeta||null};
    S.hist.unshift(h);S.hist=S.hist.slice(0,40);dbPut('hist',h).catch(()=>{});
    L.report=h;renderReport(h);
  }catch(e){
    const msg=(e instanceof ApiErr)?e.message:'No pude armar la devolución.';
    $('#p-charla').innerHTML=`<div class="card"><h2>La devolución no se pudo armar</h2><div class="note bad">${esc(msg)}</div><div class="row"><button class="btn primary" data-act="retryReport">Reintentar</button><button class="btn" data-act="newSession">Volver al inicio</button></div></div>`;
  }
}

function setUp(msg){S.upMsg=msg;const e=$('#upstat');if(e)e.textContent=msg}
async function addFiles(files){
  for(const f of files){
    try{
      setUp('Leyendo «'+f.name+'»…');
      const {text,warn}=await parseFile(f,(p,n)=>setUp('Leyendo «'+f.name+'»: página '+p+' de '+n+'…'));
      await addMaterial(titleFrom(f.name),text,warn);
    }catch(e){setUp('«'+f.name+'»: '+(e&&e.message||'no pude leerlo.'))}
  }
}
async function addMaterial(title,raw,warn){
  let text=normText(raw);
  if(text.length<80){setUp(warn||'Ese apunte casi no tiene texto.');renderApuntes();return}
  let extra='';if(text.length>1500000){text=text.slice(0,1500000);extra=' Se cortó en 1.500.000 caracteres.'}
  const m={id:uid(),title,text,ts:Date.now()};
  try{await dbPut('mats',m)}catch(e){setUp('No pude guardar el apunte en este navegador (¿modo privado o sin espacio?).');renderApuntes();return}
  S.mats.push(m);S.sel.add(m.id);LSs('sel',[...S.sel]);rebuildIndex();
  S.upMsg='Listo: «'+title+'» ('+fmt(text.length)+' caracteres).'+extra+(warn?' '+warn:'');
  renderApuntes();renderUsing();
}

/* ================= navegación y eventos ================= */
function showTab(t){
  S.tab=t;
  $$('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));
  ['charla','apuntes','ajustes'].forEach(k=>{$('#p-'+k).hidden=k!==t});
  if(t==='charla')renderCharla();else if(t==='apuntes')renderApuntes();else renderAjustes();
  renderUsing();
}
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');if(go){showTab(go.dataset.go);return}
  const tb=e.target.closest('.tab');if(tb){if(L.on&&tb.dataset.tab!=='charla'){/* la charla sigue en curso */}showTab(tb.dataset.tab);return}
  const s=e.target.closest('[data-set]');
  if(s&&!L.on){const k=s.dataset.set,v=s.dataset.v;S.setup[k]=(k==='min')?+v:v;renderCharla();return}
  const op=e.target.closest('[data-open]');
  if(op){const h=S.hist.find(x=>x.id===op.dataset.open);if(h){$('#p-charla').innerHTML=`<div class="card">${reportHTML(h)}<div class="row"><button class="btn primary" data-act="newSession">Volver</button></div></div>`}return}
  const d=e.target.closest('[data-del]');if(d){S.delAsk=d.dataset.del;renderApuntes();return}
  if(e.target.closest('[data-del-no]')){S.delAsk=null;renderApuntes();return}
  const dy=e.target.closest('[data-del-yes]');
  if(dy){const id=dy.dataset.delYes;S.delAsk=null;S.mats=S.mats.filter(x=>x.id!==id);S.sel.delete(id);LSs('sel',[...S.sel]);rebuildIndex();dbDel('mats',id).catch(()=>{});renderApuntes();renderUsing();return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='start')startSession();
  else if(act==='end')endSession();
  else if(act==='newSession'){L.report=null;renderCharla()}
  else if(act==='retryReport')makeReport();
  else if(act==='pause'){
    if(L.state==='paused'){L.err='';setState('listening');listenStart()}
    else{clearTimeout(L.ct);listenStop();setState('paused')}
  }
  else if(act==='sendnow'){const t=heard();if(t.length>1&&L.state==='listening')commitTurn(t)}
  else if(act==='finishExpo')expoFinish(false);
  else if(act==='repeat'){const last=[...L.msgs].reverse().find(m=>m.role==='assistant');if(last){clearTimeout(L.ct);listenStop();setState('speaking');L.aiDone=true;speakNow(last.content.replace(/\s*\[(interrumpida|cortada)\]$/,''));if(!TTS||!CFG.tts)maybeResume()}}
  else if(act==='retry'){L.err='';callAI()}
  else if(act==='typedsend'){
    const ta=$('#typed');const t=ta.value.trim();if(!t)return;ta.value='';
    if(L.phase==='expo'){L.base=join(L.base,t);showYou()}
    else if(L.state==='listening'||L.state==='paused'){clearTimeout(L.ct);L.err='';commitTurn(join(heard(),t))}
  }
  else if(act==='savekey')saveKey();
  else if(act==='delkey'){CFG.key='';saveCfg();S.keyMsg='Clave borrada de este navegador.';S.keyMsgCls='';renderAjustes()}
  else if(act==='testvoice')speakNow('Hola, soy tu examinadora. ¿Me escuchás bien? Esta es la voz que vas a usar.');
});
document.addEventListener('change',e=>{
  const sl=e.target.closest('[data-sel]');if(sl){if(sl.checked)S.sel.add(sl.dataset.sel);else S.sel.delete(sl.dataset.sel);LSs('sel',[...S.sel]);renderUsing();return}
  const tg=e.target.closest('[data-tog]');if(tg){CFG[tg.dataset.tog]=tg.checked;saveCfg()}
});
document.addEventListener('input',e=>{if(e.target.id==='tema')S.setup.tema=e.target.value});
window.addEventListener('beforeunload',()=>{ttsCancel()});

(async function boot(){
  renderCharla();renderUsing();
  try{
    S.mats=(await dbAll('mats')).sort((a,b)=>a.ts-b.ts);
    S.hist=(await dbAll('hist')).sort((a,b)=>b.ts-a.ts);
    S.sel=new Set([...S.sel].filter(id=>S.mats.some(m=>m.id===id)));
    if(!S.sel.size&&S.mats.length&&LSg('sel')==null)S.mats.forEach(m=>S.sel.add(m.id));
    rebuildIndex();
  }catch(e){S.upMsg='Este navegador no permite guardar apuntes (¿modo privado?). Probá en una ventana normal.'}
  renderCharla();renderUsing();
})();
})();
</script>
